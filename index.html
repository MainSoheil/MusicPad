<body>
    <header>
        <div>
            <svg fill="#ff3d8b" width="25" height="25" viewBox="0 0 15 15" xmlns="http://www.w3.org/2000/svg"><title>light-blob</title><path d="M14 7.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0"/></svg>
            <h1>MusicPad</h1>
        </div>
        <div>
            <div class="control">
                <button>
                    <svg viewBox="0 0 24 24" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 5.5L19 12L8 18.5V5.5Z" fill="#34d399"/>
                    </svg>
                </button>
                <button>
                    <svg viewBox="0 0 24 24" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
                        <rect x="6" y="5" width="4" height="14" rx="1" fill="#a0a0b8"/>
                        <rect x="14" y="5" width="4" height="14" rx="1" fill="#a0a0b8"/>
                    </svg>
                </button>
                <button>
                    <svg viewBox="0 0 24 24" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="7" fill="#ff4d6d"/>
                    </svg>
                </button>
            </div>
            <label class="bmp">
                <input type="number" value="120" placeholder="120">
                <span>bpm</span>
            </label>
            <div class="master">
                <span>Master</span>
                <div class="volume-meter" id="volumeMeter">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
        </div>
    </header>
    <div class="board">
        <button class="bg bg-purple">
            <img src="assets/icon/kick.svg" alt="icon kick" loading="lazy" decoding="async">
            <span>kick</span>
        </button>
        <button class="bg bg-blue">
            <img src="assets/icon/snare.svg" alt="icon snare" loading="lazy" decoding="async">
            <span>snare</span>
        </button>
        <button class="bg bg-cyan">
            <img src="assets/icon/hi-hat.svg" alt="icon hi-hat" loading="lazy" decoding="async">

        </button>
        <button class="bg bg-green">
            <img src="assets/icon/clap.svg" alt="icon clap" loading="lazy" decoding="async">
            <span>clap</span>
        </button>
        <button class="bg bg-orange">
            <img src="assets/icon/sub.svg" alt="icon sub" loading="lazy" decoding="async">

        </button>

        <button class="bg bg-pink">
            <img src="assets/icon/reese.svg" alt="icon reese" loading="lazy" decoding="async">
            <span>reese</span>
        </button>
        <button class="bg bg-green">
            <img src="assets/icon/wobble.svg" alt="icon wobble" loading="lazy" decoding="async">
            <span>wobble</span>
        </button>
        <button class="bg bg-cyan">
            <img src="assets/icon/pluck.svg" alt="icon pluck" loading="lazy" decoding="async">
            <span>pluck</span>
        </button>
        <button class="bg bg-blue">
            <img src="assets/icon/solo.svg" alt="icon solo" loading="lazy" decoding="async">
            <span>solo</span>
        </button>
        <button class="bg bg-blue">
            <img src="assets/icon/chord.svg" alt="icon chord" loading="lazy" decoding="async">
            <span>chord</span>
        </button>
    </div>

    <div class="beats">

                </button>
            </div>
            <div>
                <button>
                    <img src="assets/icon/plus.svg" alt="plus icon">

                </button>
                <button>

        </div>
